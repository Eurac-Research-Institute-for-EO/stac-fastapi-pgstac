apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stac-fastapi-pgstac.fullname" . }}
  labels:
    {{- include "stac-fastapi-pgstac.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stac-fastapi-pgstac.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "stac-fastapi-pgstac.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "stac-fastapi-pgstac.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "stac-fastapi-pgstac.dbEnv" . | nindent 12 }}
            - name: DB_MIN_CONN_SIZE
              value: {{ .Values.api.settings.dbMinConnSize | quote }}
            - name: DB_MAX_CONN_SIZE
              value: {{ .Values.api.settings.dbMaxConnSize | quote }}
            - name: WEB_CONCURRENCY
              value: {{ .Values.api.settings.webConcurrency | quote }}
            - name: ENABLE_TRANSACTIONS_EXTENSIONS
              value: {{ .Values.api.settings.enableTransactionsExtensions | quote }}
            - name: ENABLE_CATALOGS_EXTENSION
              value: {{ .Values.api.settings.enableCatalogsExtension | quote }}
            - name: USE_API_HYDRATE
              value: {{ .Values.api.settings.useApiHydrate | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.api.settings.corsOrigins | quote }}
            - name: CORS_METHODS
              value: {{ .Values.api.settings.corsMethods | quote }}
            {{- with .Values.api.settings.enabledExtensions }}
            - name: ENABLED_EXTENSIONS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.settings.uvicornRootPath }}
            - name: UVICORN_ROOT_PATH
              value: {{ . | quote }}
            {{- end }}
            {{- range $name, $value := .Values.api.gdalEnv }}
            {{- if not (kindIs "invalid" $value) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.api.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.api.probes.livenessPath | quote }}
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.livenessPath | quote }}
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readinessPath | quote }}
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
