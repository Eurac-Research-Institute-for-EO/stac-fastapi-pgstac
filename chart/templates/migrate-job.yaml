{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "stac-fastapi-pgstac.fullname" . }}-migrate
  labels:
    {{- include "stac-fastapi-pgstac.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Run after the (bundled) database exists, on install and upgrade. The job
    # waits for the DB to accept connections before running the migration.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "stac-fastapi-pgstac.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            {{- include "stac-fastapi-pgstac.dbEnv" . | nindent 12 }}
            # pip --user needs a writable HOME (we run as an arbitrary uid).
            - name: HOME
              value: /tmp
          command:
            - sh
            - -c
            - |
              set -e
              export PATH="$HOME/.local/bin:$PATH"
              echo "Installing pypgstac{{ .Values.migrations.pypgstacVersion }} ..."
              pip install --no-cache-dir --user "pypgstac[psycopg]{{ .Values.migrations.pypgstacVersion }}"
              echo "Running pypgstac migrate (retrying until the DB is ready) ..."
              n=0
              until pypgstac migrate; do
                n=$((n+1))
                if [ "$n" -ge 30 ]; then echo "migrate failed after $n attempts"; exit 1; fi
                echo "DB not ready or migrate failed; retry $n/30 in 4s ..."
                sleep 4
              done
              echo "Migration complete."
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}
